# Building and testing only reads the repository. Both jobs repeat that scope
# so a future copy of a job does not silently inherit more than it needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the auto-merge bot re-run CI on main after it merges a PR.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Build and test on a Go release that still gets security fixes. The
  # module minimum (go.mod) stays at what the Stellar SDK requires.
  GO_VERSION: "1.26"

jobs:
  test:
    name: test (${{ matrix.os }})
    # Every supported OS runs the unit suite: releases ship macOS and Windows
    # binaries, and path handling, keystore reading and line endings all
    # differ by platform, so a failure should surface here rather than after
    # a tag. The Postgres half lives in the integration job below, because
    # GitHub Actions service containers only exist on Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          # The Windows race detector needs cgo and a C toolchain, which the
          # runner does not provide by default. The detector still runs on
          # the other two legs of the matrix.
          - os: windows-latest
            race: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # bash on every runner: gofmt -l . is a POSIX one-liner, and Windows
      # would otherwise land in PowerShell with different quoting.
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ matrix.race }} -count=1 ./...

  integration:
    name: postgres integration
    # Deliberately Linux-only: service containers are a GitHub Actions
    # Linux-runner feature, so Postgres cannot be attached to the macOS or
    # Windows legs. Those legs still compile and run the whole unit suite,
    # which skips the database-gated cases; this job is what exercises them.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroforge
          POSTGRES_PASSWORD: soroforge
          POSTGRES_DB: soroforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # TEST_DATABASE_URL turns on the Postgres half of the store
      # conformance suite, including the migration round-trip test; without
      # it those cases would silently skip. The live testnet smoke tests stay
      # off: CI must not depend on a public RPC endpoint being up.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://soroforge:soroforge@localhost:5432/soroforge?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli lint --extends minimal internal/api/openapi.json

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t soroforge:ci .
