# GoReleaser creates the GitHub release, so this is the one workflow that needs
# contents: write. The job repeats that scope; nothing else is granted.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The same Postgres CI uses, so the store suite runs before a release
    # rather than skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroforge
          POSTGRES_PASSWORD: soroforge
          POSTGRES_DB: soroforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # A release must not ship code that fails its own suite.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://soroforge:soroforge@localhost:5432/soroforge?sslmode=disable
        run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
